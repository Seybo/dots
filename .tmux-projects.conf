# Ghostty Cmd-Shift-u/m sends these characters; cycle to the previous/next session.
bind-key -n '⟨' switch-client -p
bind-key -n '⟩' switch-client -n

# Ghostty Cmd-Shift-comma jumps to the next pane needing agent attention.
bind-key -n '⟬' run-shell -b '~/.dots/no_stow/bin/tmux/focus-attention'
# Ghostty Cmd-Shift-period switches to or starts the base session.
bind-key -n '⟭' run-shell '~/.dots/no_stow/bin/tmux/switch-session to base'
# Ghostty Cmd-Shift-slash opens the session picker.
bind-key -n '⟮' choose-tree -s

# In session mode, Escape exits the mode without doing tmux work.
bind-key -T user-sessions Escape send-keys Escape
# Tab returns to the last tmux session.
bind-key -T user-sessions Tab switch-client -l

# Cmd-o enters session operations mode; these keys handle less frequent actions.
bind-key -n '⚙' switch-client -T user-operations \; display-message 'session operations'
bind-key -T user-operations Escape send-keys Escape
# In operations mode, f opens tmux-fzf.
bind-key -T user-operations f if-shell 'test -f "$HOME/.tmux/plugins/tmux-fzf/main.sh"' 'run-shell -b "TMUX_FZF_OPTIONS=\"-p -w 85% -h 70% -m\" TMUX_FZF_ORDER=\"session|window|pane|command|keybinding|process\" bash \"$HOME/.tmux/plugins/tmux-fzf/main.sh\""' 'display-message "tmux-fzf missing: install ~/.tmux/plugins/tmux-fzf"'
# In operations mode, c saves the focused pane's visible screen to a text file.
bind-key -T user-operations c run-shell -b '~/.dots/no_stow/bin/tmux/capture-pane screen "#{pane_id}"'
# In operations mode, h saves the focused pane's full retained history to a text file.
bind-key -T user-operations h run-shell -b '~/.dots/no_stow/bin/tmux/capture-pane history "#{pane_id}"'
# In operations mode, n prompts for and creates an ad-hoc tmux session.
bind-key -T user-operations n command-prompt -p 'new session name' 'new-session -s "%%"'
# In operations mode, d detaches the current tmux client.
bind-key -T user-operations d detach-client
# In operations mode, q asks before switching away and killing the old tmux session.
bind-key -T user-operations q confirm-before -p 'kill session #S and switch back? (y/n)' 'run-shell "$HOME/.dots/no_stow/bin/tmux/kill-current-session \"#{session_name}\""'
# In operations mode, r reloads tmux config.
bind-key -T user-operations r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# In session mode, these one-letter aliases select a project for workspace-number mode.
bind-key -T user-sessions g set-option -q @tmux-project shaka_gtm \; switch-client -T user-project-workspaces
bind-key -T user-sessions o set-option -q @tmux-project shaka_outreach \; switch-client -T user-project-workspaces
bind-key -T user-sessions t set-option -q @tmux-project shaka_trp \; switch-client -T user-project-workspaces
bind-key -T user-sessions m set-option -q @tmux-project my_finance \; switch-client -T user-project-workspaces
bind-key -T user-sessions h set-option -q @tmux-project my_health \; switch-client -T user-project-workspaces
bind-key -T user-sessions k set-option -q @tmux-project misc_kaamp \; switch-client -T user-project-workspaces

# In project workspace mode, a number switches to or starts that project's workspace session.
bind-key -T user-project-workspaces Escape switch-client -T user-sessions
bind-key -T user-project-workspaces 1 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}1"'
bind-key -T user-project-workspaces 2 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}2"'
bind-key -T user-project-workspaces 3 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}3"'
bind-key -T user-project-workspaces 4 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}4"'
bind-key -T user-project-workspaces 5 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}5"'
bind-key -T user-project-workspaces 6 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}6"'
bind-key -T user-project-workspaces 7 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}7"'
bind-key -T user-project-workspaces 8 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}8"'
bind-key -T user-project-workspaces 9 run-shell '~/.dots/no_stow/bin/tmux/switch-session to "#{@tmux-project}9"'
