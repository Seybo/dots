# Ghostty Cmd-Shift-u/m sends these characters; cycle to the previous/next session.
bind-key -n '⟨' switch-client -p
bind-key -n '⟩' switch-client -n
# Ghostty Cmd-Shift-p toggles between the two most recently used sessions.
bind-key -n '⟪' switch-client -l

# Ghostty Cmd-Shift-comma jumps to the next pane needing agent attention.
bind-key -n '⟬' run-shell -b '~/.dots/no_stow/bin/tmux/focus-attention'
# Ghostty Cmd-Shift-period switches to or starts the base session.
bind-key -n '⟭' run-shell '~/.dots/no_stow/bin/tmux/switch-session to base'
# Ghostty Cmd-Shift-slash opens the session picker.
bind-key -n '⟮' choose-tree -s

# Cmd-o enters session operations mode; these keys handle less frequent actions.
bind-key -n '⚙' switch-client -T user-operations \; display-message 'session operations'
bind-key -T user-operations Escape send-keys Escape
# In operations mode, f opens tmux-fzf.
bind-key -T user-operations f if-shell 'test -f "$HOME/.tmux/plugins/tmux-fzf/main.sh"' 'run-shell -b "TMUX_FZF_OPTIONS=\"-p -w 85% -h 70% -m\" TMUX_FZF_ORDER=\"session|window|pane|command|keybinding|process\" bash \"$HOME/.tmux/plugins/tmux-fzf/main.sh\""' 'display-message "tmux-fzf missing: install ~/.tmux/plugins/tmux-fzf"'
# In operations mode, c saves the focused pane's visible screen to a text file.
bind-key -T user-operations c run-shell -b '~/.dots/no_stow/bin/tmux/capture-pane screen "#{pane_id}"'
# In operations mode, h saves the focused pane's full retained history to a text file.
bind-key -T user-operations h run-shell -b '~/.dots/no_stow/bin/tmux/capture-pane history "#{pane_id}"'
# In operations mode, n prompts for and creates an ad-hoc tmux session.
bind-key -T user-operations n command-prompt -p 'new session name' 'new-session -s "%%"'
# In operations mode, d detaches the current tmux client.
bind-key -T user-operations d detach-client
# In operations mode, q asks before switching away and killing the old tmux session.
bind-key -T user-operations q confirm-before -p 'kill session #S and switch back? (y/n)' 'run-shell "$HOME/.dots/no_stow/bin/tmux/kill-current-session \"#{session_name}\""'
# In operations mode, r reloads the shared tmux config.
bind-key -T user-operations r source-file ~/.dots/.tmux.conf \; display-message 'tmux config reloaded'
