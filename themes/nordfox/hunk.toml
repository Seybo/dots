# Hunk theme for the local Nordfox environment.
# UI and syntax colors use the adjusted local palette in themes/nordfox/pi.json
# and themes/nordfox/claude.json. Syntax highlighting inherits Hunk's bundled
# Nord theme: https://github.com/modem-dev/hunk/blob/v0.17.7/src/ui/lib/shikiThemes.ts

theme = "custom"

[custom_theme]
base = "nord"
label = "Nordfox"
background = "#2e3440"
panel = "#3b4252"
panelAlt = "#3e4a5b"
border = "#4c566a"
accent = "#a3be8c"
accentMuted = "#3e4a5b"
text = "#cdcecf"
muted = "#abb1bb"
addedBg = "#3d4c45"
removedBg = "#4a3740"
movedAddedBg = "#3e4a5b"
movedRemovedBg = "#3e4a5b"
contextBg = "#2e3440"
addedContentBg = "#3d4c45"
removedContentBg = "#4a3740"
contextContentBg = "#2e3440"
addedSignColor = "#a3be8c"
removedSignColor = "#bf616a"
lineNumberBg = "#2e3440"
lineNumberFg = "#7e8188"
selectedHunk = "#3e4a5b"
badgeAdded = "#a3be8c"
badgeRemoved = "#bf616a"
badgeNeutral = "#abb1bb"
fileNew = "#a3be8c"
fileDeleted = "#bf616a"
fileRenamed = "#b48ead"
fileModified = "#81a1c1"
fileUntracked = "#88c0d0"
noteBorder = "#88c0d0"
noteBackground = "#3b4252"
noteTitleBackground = "#3e4a5b"
noteTitleText = "#cdcecf"

[custom_theme.syntax]
default = "#cdcecf"
keyword = "#bf616a"
string = "#a3be8c"
comment = "#7e8188"
number = "#b48ead"
function = "#81a1c1"
property = "#88c0d0"
type = "#88c0d0"
variable = "#cdcecf"
operator = "#c9826b"
punctuation = "#abb1bb"
