# Everforest hard light colors for Alacritty.
# Customized local variant derived from the canonical upstream palette:
# https://github.com/sainnhe/everforest/blob/master/palette.md

[colors.primary]
background = "#fffdf6"
foreground = "#3d484d"

[colors.cursor]
cursor = "#5c6a72"
text = "#fffbef"

[colors.vi_mode_cursor]
cursor = "#5c6a72"
text = "#fffbef"

[colors.search.matches]
background = "#dfa000"
foreground = "#3d484d"

[colors.search.focused_match]
background = "#f57d26"
foreground = "#fffbef"

[colors.footer_bar]
background = "#3d484d"
foreground = "#fffdf6"

[colors.selection]
background = "#f0f2d4"
text = "#5c6a72"

[colors.normal]
black = "#5c6a72"
red = "#f85552"
green = "#697801"
yellow = "#dfa000"
blue = "#3a94c5"
magenta = "#df69ba"
cyan = "#267b5f"
white = "#fffbef"

[colors.bright]
black = "#939f91"
red = "#f85552"
