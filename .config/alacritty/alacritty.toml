[env]
TERM = 'xterm-256color'

[general]
working_directory = '.dots'
live_config_reload = true

[cursor]
style = 'Underline'
unfocused_hollow = true

[font]
size = 15.0

[font.bold]
family = 'Hack Nerd Font'
style = 'Bold'

[font.italic]
# family = 'Lekton Nerd Font Mono'
family = 'Iosevka Nerd Font Mono'
style = 'Italic'

[font.normal]
family = 'SauceCodePro Nerd Font Mono'
style = 'Regular'

[font.offset]
x = 0
y = 2

[scrolling]
history = 99000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[terminal]
shell = { program = '/bin/zsh', args = ['-l'] }

[window]
decorations = 'none'
dynamic_padding = false
startup_mode = 'Fullscreen'
option_as_alt = 'Both'

[window.padding]
x = 10
y = 6

[keyboard]
bindings = [
  # Use Oma's existing tmux prefix bindings for window navigation.
  { key = 'U', mods = 'Command', chars = "\u0002p" },
  { key = 'M', mods = 'Command', chars = "\u0002n" },
  # Match Squirrel Ghostty's active-pane zoom shortcut over direct SSH.
  { key = 'F', mods = 'Command|Shift', chars = "\uF436" },
  # Use Oma's existing tmux prefix bindings for pane navigation over direct SSH.
  { key = 'H', mods = 'Command', chars = "\u0002\u001B[D" },
  { key = 'J', mods = 'Command', chars = "\u0002\u001B[B" },
  { key = 'K', mods = 'Command', chars = "\u0002\u001B[A" },
  { key = 'L', mods = 'Command', chars = "\u0002\u001B[C" },
  # Enter tmux pane mode using the same shortcut as Squirrel Ghostty.
  { key = 'P', mods = 'Command', chars = "\u0002P" },
  # Enter tmux copy mode using the same shortcut as Squirrel Ghostty.
  { key = ';', mods = 'Command', chars = "\u0002[" },
]
